[project]
name = "calib-helper"
version = "0.1.0"
description = "JAKA、Mech-Vision 机器人视觉标定辅助工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "pyautogui>=0.9.54",
    "pyyaml>=6.0.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "black>=26.5.1",
]
