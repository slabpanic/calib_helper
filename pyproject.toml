[project]
name = "calib-helper"
version = "0.1.0"
description = "JAKA、Mech-Vision 机器人视觉标定辅助工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "keyboard>=0.13.5",
    "loguru>=0.7.3",
    "paddleocr>=3.7.0",
    "paddlepaddle==3.2.1",
    "pyautogui>=0.9.54",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "black>=26.5.1",
]
